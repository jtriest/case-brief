<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="referrer" content="no-referrer">
<title>RB Case Brief</title>
<meta name="robots" content="noindex, nofollow">
<style>
/* Layout: a consult-request document. Patient header, history, then data in bordered table cards, chronology, questions, sources. Sticky contents column on wide screens. One link color, tabular figures. */
:root {
  --bg: #ffffff;
  --ink: #15181c;
  --text: #2e333a;
  --muted: #6b737d;
  --faint: #a3aab3;
  --rule: #e6e8ec;
  --border: #dfe2e7;
  --card: #f7f8fa;
  --col2: #fafbfc;
  --page: #f4f5f8;
  --surface: #ffffff;
  --tint: #eaf1fb;
  --shadow: 0 1px 2px rgba(16,24,40,0.04), 0 6px 20px rgba(16,24,40,0.06);
  --link: #1a5fb4;
  --flag: #fff6e2;
  --flag-bar: #e0a33a;
  --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg:#111316; --ink:#eef0f3; --text:#d0d5db; --muted:#8f97a1; --faint:#5b626b; --rule:#22262b; --border:#2b3036; --card:#1d2126; --col2:#1b1f24; --page:#0d0f12; --surface:#16191d; --tint:#1a2638; --shadow:0 1px 2px rgba(0,0,0,0.4); --link:#86b6ff; --flag:#2e2716; --flag-bar:#d9a441; color-scheme: dark; }
}
:root[data-theme="dark"] { --bg:#111316; --ink:#eef0f3; --text:#d0d5db; --muted:#8f97a1; --faint:#5b626b; --rule:#22262b; --border:#2b3036; --card:#1d2126; --col2:#1b1f24; --page:#0d0f12; --surface:#16191d; --tint:#1a2638; --shadow:0 1px 2px rgba(0,0,0,0.4); --link:#86b6ff; --flag:#2e2716; --flag-bar:#d9a441; color-scheme: dark; }
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
body {
  background: var(--page); color: var(--text);
  font: 16px/1.6 var(--sans); letter-spacing: -0.005em; -webkit-font-smoothing: antialiased;
  padding-left: max(20px, env(safe-area-inset-left, 0px));
  padding-right: max(20px, env(safe-area-inset-right, 0px));
  padding-block: 48px 80px;
}
.page { max-width: 1140px; margin: 0 auto; display: grid; grid-template-columns: 176px minmax(0, 1fr); gap: 64px; }
a { color: var(--link); text-decoration: none; }
a:hover { text-decoration: underline; text-underline-offset: 2px; }
a:focus-visible { outline: 2px solid var(--link); outline-offset: 2px; border-radius: 4px; }
p, ul, ol, dl, h1, h2, h3, table { margin: 0; }
b { font-weight: 600; color: var(--ink); }
.mono { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.sel { user-select: all; }

/* Contents */
.toc { position: sticky; top: calc(48px + env(safe-area-inset-top, 0px)); align-self: start; font-size: 14px; }
.toc p { font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin-bottom: 12px; padding-left: 12px; }
.toc ol { list-style: none; padding: 0; display: grid; gap: 2px; }
.toc a { display: block; padding: 7px 12px; color: var(--muted); border-radius: 10px; }
.toc a:hover { color: var(--ink); background: var(--surface); text-decoration: none; }
.toc a.on { color: var(--ink); font-weight: 600; background: var(--tint); }
.mnav { display: none; }
#timeline td, #status td, #status th, #labs td, #labs th { padding-block: 13px; }
tr.yr th { background: var(--card); font-size: 13px; font-weight: 600; letter-spacing: .04em; color: var(--muted); padding-block: 8px; width: auto; }
.recgrid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 28px; background: var(--surface); border-radius: 18px; box-shadow: var(--shadow); padding: 24px 28px; }
.recgrid li:last-child { border-bottom: 0; }
.recgrid h3 { font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
.recgrid ul { list-style: none; padding: 0; display: grid; }
.recgrid li { display: grid; grid-template-columns: 70px minmax(0, 1fr); gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--rule); font-size: 15px; }
.recgrid li span { color: var(--muted); font-size: 14px; font-variant-numeric: tabular-nums; }

main { min-width: 0; max-width: 860px; }

/* Patient header */
.pt { background: var(--surface); border-radius: 18px; box-shadow: var(--shadow); padding: 30px 32px; display: grid; gap: 10px; }
.doctype { font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
h1 { font-size: 36px; line-height: 1.12; font-weight: 700; letter-spacing: -0.025em; color: var(--ink); }
.dx { font-size: 17px; color: var(--text); max-width: 60ch; }
.ptgrid { display: grid; grid-template-columns: 136px minmax(0, 1fr); gap: 8px 20px; font-size: 15px; margin-top: 10px; }
.ptgrid dt { color: var(--muted); }
.ptgrid dd { margin: 0; color: var(--ink); line-height: 1.55; }
.actions { display: flex; flex-wrap: wrap; gap: 10px; padding-top: 14px; }
.btn { display: inline-flex; align-items: center; padding: 10px 18px; border-radius: 10px; border: 1px solid var(--border); color: var(--ink); font-weight: 600; font-size: 15px; transition: border-color .15s, background .15s; }
.btn:hover { text-decoration: none; border-color: var(--faint); background: var(--card); }
.btn.primary { background: var(--link); border-color: var(--link); color: var(--bg); }
.btn.primary:hover { background: var(--link); filter: brightness(1.08); }

/* Sections */
section { padding-top: 56px; scroll-margin-top: 24px; display: grid; gap: 16px; }
h2 { font-size: 26px; line-height: 1.2; font-weight: 700; letter-spacing: -0.02em; color: var(--ink); }
section > p { max-width: 68ch; }

/* Labelled rows (history), same rhythm as the status table */
.card { background: var(--surface); border-radius: 18px; box-shadow: var(--shadow); }
dl.facts { display: grid; grid-template-columns: max-content minmax(0, 1fr); font-size: 15px; line-height: 1.6; }
dl.facts dt, dl.facts dd { margin: 0; padding: 16px 24px; border-bottom: 1px solid var(--rule); }
dl.facts dt { font-weight: 600; color: var(--ink); font-size: 14px; padding-right: 8px; min-width: 150px; }
dl.facts dt:last-of-type, dl.facts dd:last-of-type { border-bottom: 0; }
dl.facts dt small { display: block; font-weight: 400; color: var(--muted); font-size: 13px; }

ol.qs { list-style: none; padding: 8px 28px; counter-reset: q; display: grid; background: var(--surface); border-radius: 18px; box-shadow: var(--shadow); }
ol.qs li:last-child { border-bottom: 0; }
ol.qs li { counter-increment: q; display: grid; grid-template-columns: 32px minmax(0, 1fr); gap: 8px; padding: 14px 0; border-bottom: 1px solid var(--rule); }
ol.qs li::before { content: counter(q); font-weight: 600; color: var(--link); font-variant-numeric: tabular-nums; }

/* Table cards */
.tw { overflow-x: auto; background: var(--surface); border-radius: 18px; box-shadow: var(--shadow); }
table { border-collapse: collapse; width: 100%; font-size: 15px; line-height: 1.55; }
th, td { text-align: left; vertical-align: top; padding: 18px 24px; border-bottom: 1px solid var(--rule); }
tbody tr:last-child > * { border-bottom: 0; }
thead th { background: var(--surface); font-size: 15px; font-weight: 600; color: var(--ink); border-bottom: 1px solid var(--border); padding-block: 14px; }
thead th span { display: block; font-weight: 400; color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; margin-top: 1px; }
tbody th { font-weight: 600; color: var(--ink); white-space: nowrap; width: 1%; font-size: 14px; }
td.date, th.date { font-weight: 600; color: var(--ink); white-space: nowrap; width: 1%; font-variant-numeric: tabular-nums; }
.compare th[scope="col"] { width: 44%; font-size: 18px; font-weight: 700; letter-spacing: -0.01em; padding-block: 18px; }
.compare th[scope="col"] span { font-size: 14px; font-weight: 500; margin-top: 3px; }
.imaging td:nth-child(2) { width: 54%; }
.imaging th:nth-child(3), .imaging td:nth-child(3), .compare th:nth-child(3), .compare td:nth-child(3) { border-left: 1px solid var(--rule); }
td.date { padding-right: 28px; }
tr.flag > td { background: var(--flag) !important; }
tr.flag > td:first-child { box-shadow: inset 3px 0 0 var(--flag-bar); }

ul.ln { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; }
ul.ln li { position: relative; padding-left: 14px; }
ul.ln li::before { content: ""; position: absolute; left: 1px; top: 0.7em; width: 4px; height: 4px; border-radius: 50%; background: var(--faint); }

.between { background: var(--surface); box-shadow: var(--shadow); border-radius: 18px; padding: 22px 26px; display: grid; gap: 10px; font-size: 15px; }
.between h3 { font-size: 14px; font-weight: 600; color: var(--ink); }
.note { font-size: 14px; color: var(--muted); max-width: 72ch; }

/* Records */
ul.recs { list-style: none; padding: 0; columns: 2; column-gap: 40px; font-size: 15px; }
ul.recs li { break-inside: avoid; display: grid; grid-template-columns: 76px minmax(0, 1fr); gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--rule); }
ul.recs .mono { color: var(--muted); font-size: 14px; }

footer { margin-top: 56px; padding-top: 20px; border-top: 1px solid var(--rule); font-size: 14px; color: var(--muted); }
.ptgrid dd a, footer a { color: inherit; text-decoration: underline; text-decoration-color: var(--border); text-underline-offset: 3px; }
.ptgrid dd a:hover, footer a:hover { text-decoration-color: currentColor; }

@media (max-width: 880px) {
  .page { grid-template-columns: minmax(0, 1fr); gap: 0; }
  .toc { display: none; }
  .recgrid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .pt { padding: 22px 20px; }
  ol.qs, .recgrid { padding-inline: 18px; }
  .mnav { display: block; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--page); margin-inline: -20px; padding: 10px 20px; border-bottom: 1px solid var(--rule); }
  .mnav ul { list-style: none; margin: 0; padding: 0; display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; }
  .mnav ul::-webkit-scrollbar { display: none; }
  .mnav a { display: block; white-space: nowrap; font-size: 14px; font-weight: 500; color: var(--text); padding: 6px 12px; border-radius: 999px; background: var(--surface); border: 1px solid var(--border); }
  .mnav a.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  section { scroll-margin-top: 64px; }
  ul.recs { columns: 1; }
}
@media (max-width: 560px) {
  body { padding-block: 28px 60px; }
  h1 { font-size: 30px; }
  section { padding-top: 44px; }
  .ptgrid { grid-template-columns: 112px minmax(0, 1fr); gap: 8px 14px; }
  .btn { flex: 1 1 100%; justify-content: center; }
  table.stack thead { display: none; }
  table.stack, table.stack tbody, table.stack tr, table.stack td, table.stack th { display: block; width: auto !important; }
  .recgrid { grid-template-columns: minmax(0, 1fr); gap: 20px; }
  table.stack tr.yr { padding: 8px 16px; background: var(--card); }
  table.stack tr { padding: 14px 16px; border-bottom: 1px solid var(--rule); }
  table.stack tbody tr:last-child { border-bottom: 0; }
  table.stack td, table.stack th { border: 0 !important; padding: 2px 0 !important; background: none !important; box-shadow: none !important; }
  table.stack td[data-k]::before { content: attr(data-k); display: block; color: var(--muted); font-size: 13px; font-weight: 500; margin-top: 8px; }
  table.stack tbody th { font-size: 14px; color: var(--ink); font-weight: 600; }
  table.stack tr.flag { background: var(--flag); box-shadow: inset 3px 0 0 var(--flag-bar); }
  table:not(.stack) th, table:not(.stack) td { padding: 12px 14px; }
  dl.facts { grid-template-columns: minmax(0, 1fr); }
  dl.facts dt { padding: 14px 16px 2px; border-bottom: 0; min-width: 0; }
  dl.facts dd { padding: 0 16px 14px; }
}
@media print {
  body { background: #fff; color: #000; padding: 0; font-size: 11pt; }
  .page { display: block; max-width: none; }
  .toc, .mnav, .actions { display: none !important; }
  main { max-width: none; }
  .pt, .tw, .card, .recgrid, ol.qs, .between { box-shadow: none; border: 1px solid #ccc; }
  section { padding-top: 24px; }
  h2 { break-after: avoid; }
  tr, li, dl.facts dd, .between { break-inside: avoid; }
  a { color: inherit; }
}
</style>
<style>
[hidden] { display: none !important; }
.gate { min-height: 70vh; display: grid; place-items: center; }
.gate form { width: 100%; max-width: 360px; display: grid; gap: 14px; }
.gate h1 { font-size: 24px; }
.gate p { color: var(--muted); font-size: 15px; }
.gate label { font-size: 14px; font-weight: 600; color: var(--ink); }
.gate input { font: inherit; font-size: 17px; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--border); background: var(--bg); color: var(--ink); width: 100%; }
.gate input:focus { outline: 2px solid var(--link); outline-offset: 1px; border-color: var(--link); }
.gate button { font: inherit; font-weight: 600; font-size: 16px; padding: 12px; border-radius: 10px; border: 0; background: var(--link); color: var(--bg); cursor: pointer; }
.gate button:disabled { opacity: .6; cursor: default; }
.gate .err { color: #c0392b; font-size: 14px; min-height: 1.4em; }
</style>

</head>
<body>
<div class="gate" id="gate">
  <form id="unlock" autocomplete="off">
    <span class="doctype">Request for outside review</span>
    <h1>Protected case brief</h1>
    <p>Enter the password you were given.</p>
    <label for="pw">Password</label>
    <input id="pw" name="pw" type="password" autocapitalize="none" autocorrect="off" spellcheck="false" required autofocus>
    <button id="go" type="submit">View</button>
    <div class="err" id="err" role="alert"></div>
  </form>
</div>
<div id="app" hidden></div>

  function b(x) { return Uint8Array.from(atob(x), function (c) { return c.charCodeAt(0); }); }
  async function decrypt(pw) {
    var base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);

    document.getElementById("gate").hidden = true;

  }
  async function attempt(pw, quiet) {

  var links = Array.prototype.slice.call(document.querySelectorAll('.toc a, .mnav a'));
  var ids = Array.from(new Set(links.map(function (a) { return a.getAttribute('href').slice(1); })));
  var secs = ids.map(function (id) { return document.getElementById(id); }).filter(Boolean);
  function update() {
    var y = window.scrollY + 120, cur = secs[0] && secs[0].id;
    secs.forEach(function (s) { if (s.offsetTop <= y) cur = s.id; });
    if (window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - 4) cur = secs[secs.length - 1].id;
    if (clicked && Date.now() - clicked.t < 900) cur = clicked.id;
    links.forEach(function (a) {

      a.classList.toggle('on', on);
      if (on && a.closest('.mnav')) { var u = a.closest('ul'); var l = a.offsetLeft - 20; if (Math.abs(u.scrollLeft - l) > 40) u.scrollTo({ left: l, behavior: 'smooth' }); }
    });
  }
  var clicked = null;
  links.forEach(function (a) { a.addEventListener('click', function () { clicked = { id: a.getAttribute('href').slice(1), t: Date.now() }; setTimeout(update, 0); setTimeout(update, 950); }); });

  update();
})();
