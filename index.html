<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="referrer" content="no-referrer">
<title>RB Case Brief</title>
<meta name="robots" content="noindex, nofollow">
<style>
/* Layout: an editorial consult document. One calm paper surface, hairline rules instead of cards, serif display type over a sans reading face, numbered sections, a quiet sticky contents rail. Color is reserved for links, the active section and the one flagged finding. */
:root {
  --page: #fbfbf9;
  --bg: #fbfbf9;
  --surface: #ffffff;
  --ink: #15171a;
  --text: #34383e;
  --muted: #6c7178;
  --faint: #a7abb1;
  --rule: #e8e7e2;
  --border: #d9d8d2;
  --wash: #f3f3ef;
  --tint: #edf2fb;
  --link: #2453b8;
  --flag: #fbf3dc;
  --flag-bar: #c9952b;
  --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  --serif: ui-serif, "New York", "Iowan Old Style", Charter, "Source Serif Pro", Georgia, serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --page:#121314; --bg:#121314; --surface:#18191b; --ink:#f1f0ec; --text:#cfd0cc; --muted:#8e9196; --faint:#5d6066; --rule:#26282b; --border:#34363a; --wash:#1b1d1f; --tint:#1a2335; --link:#8db3ff; --flag:#2a2416; --flag-bar:#d6a440; color-scheme: dark; }
}
:root[data-theme="dark"] { --page:#121314; --bg:#121314; --surface:#18191b; --ink:#f1f0ec; --text:#cfd0cc; --muted:#8e9196; --faint:#5d6066; --rule:#26282b; --border:#34363a; --wash:#1b1d1f; --tint:#1a2335; --link:#8db3ff; --flag:#2a2416; --flag-bar:#d6a440; color-scheme: dark; }
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
body {
  margin: 0; background: var(--page); color: var(--text);
  font: 16.5px/1.65 var(--sans); -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
  padding-left: max(24px, env(safe-area-inset-left, 0px));
  padding-right: max(24px, env(safe-area-inset-right, 0px));
  padding-block: 64px 96px;
}
::selection { background: var(--tint); }
.page { max-width: 1120px; margin: 0 auto; display: grid; grid-template-columns: 180px minmax(0, 1fr); gap: 72px; }
main { min-width: 0; max-width: 820px; }
a { color: var(--link); text-decoration: none; }
a:hover { text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1px; }
a:focus-visible { outline: 2px solid var(--link); outline-offset: 3px; border-radius: 3px; }
p, ul, ol, dl, h1, h2, h3, table { margin: 0; }
b { font-weight: 600; color: var(--ink); }
.mono { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.sel { user-select: all; }

/* Contents rail */
.toc { position: sticky; top: calc(64px + env(safe-area-inset-top, 0px)); align-self: start; font-size: 14px; padding-top: 6px; }
.toc p { font-size: 11px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin-bottom: 14px; }
.toc ol { list-style: none; padding: 0; border-left: 1px solid var(--rule); counter-reset: toc; }
.toc li { counter-increment: toc; }
.toc a { display: flex; gap: 10px; padding: 6px 0 6px 16px; margin-left: -1px; border-left: 2px solid transparent; color: var(--muted); line-height: 1.4; transition: color .15s, border-color .15s; }
.toc a::before { content: counter(toc, decimal-leading-zero); font-size: 11px; font-variant-numeric: tabular-nums; color: var(--faint); padding-top: 2px; }
.toc a:hover { color: var(--ink); text-decoration: none; }
.toc a.on { color: var(--ink); font-weight: 600; border-left-color: var(--ink); }
.toc a.on::before { color: var(--link); }
.mnav { display: none; }

/* Patient header */
.pt { display: grid; gap: 14px; padding-bottom: 40px; border-bottom: 1px solid var(--rule); }
.doctype { font-size: 11px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
h1 { font-family: var(--serif); font-size: 46px; line-height: 1.05; font-weight: 600; letter-spacing: -0.015em; color: var(--ink); }
.dx { font-family: var(--serif); font-size: 20px; line-height: 1.45; color: var(--text); max-width: 34em; }
.ptgrid { display: grid; grid-template-columns: repeat(4, minmax(0, auto)); justify-content: start; column-gap: 44px; row-gap: 4px; margin-top: 14px; font-size: 14.5px; line-height: 1.55; grid-auto-flow: column; grid-template-rows: auto auto; }
.ptgrid dt { font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.ptgrid dd { margin: 0; color: var(--ink); }
.ptgrid dd a, footer a { color: inherit; text-decoration: underline; text-decoration-color: var(--border); text-underline-offset: 3px; }
.ptgrid dd a:hover, footer a:hover { text-decoration-color: currentColor; }
.actions { display: flex; flex-wrap: wrap; gap: 10px; padding-top: 18px; }
.btn { display: inline-flex; align-items: center; padding: 10px 18px; border-radius: 999px; border: 1px solid var(--border); color: var(--ink); font-weight: 600; font-size: 14.5px; transition: border-color .15s, background .15s; }
.btn:hover { text-decoration: none; border-color: var(--ink); }
.btn.primary { background: var(--ink); border-color: var(--ink); color: var(--page); }
.btn.primary:hover { opacity: .88; }

/* Sections: numbered, separated by space and a hairline */
main { counter-reset: sec; }
section { counter-increment: sec; padding-top: 72px; scroll-margin-top: 24px; display: grid; gap: 22px; }
h2 { font-family: var(--serif); font-size: 30px; line-height: 1.15; font-weight: 600; letter-spacing: -0.01em; color: var(--ink); display: flex; align-items: baseline; gap: 14px; }
h2::before { content: counter(sec, decimal-leading-zero); font-family: var(--sans); font-size: 13px; font-weight: 600; letter-spacing: .04em; color: var(--link); font-variant-numeric: tabular-nums; }
section > p { max-width: 66ch; }

/* Labelled rows (history) */
.card { border-top: 1px solid var(--ink); }
dl.facts { display: grid; grid-template-columns: 168px minmax(0, 1fr); line-height: 1.7; }
dl.facts dt, dl.facts dd { margin: 0; padding: 18px 0; border-bottom: 1px solid var(--rule); }
dl.facts dt { font-weight: 600; color: var(--ink); font-size: 14.5px; padding-right: 24px; }
dl.facts dd { max-width: 64ch; }
dl.facts dt small { display: block; font-weight: 400; color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }

/* Tables: open, ruled, no boxes */
.tw { overflow-x: auto; border-top: 1px solid var(--ink); }
table { border-collapse: collapse; width: 100%; font-size: 15.5px; line-height: 1.6; }
th, td { text-align: left; vertical-align: top; padding: 16px 20px 16px 0; border-bottom: 1px solid var(--rule); }
th:last-child, td:last-child { padding-right: 0; }
thead th { font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); padding-block: 12px; }
thead th span { display: block; font-size: 13px; font-weight: 400; letter-spacing: 0; text-transform: none; color: var(--muted); font-variant-numeric: tabular-nums; margin-top: 2px; }
tbody th { font-weight: 600; color: var(--ink); white-space: nowrap; width: 1%; font-size: 14.5px; padding-right: 32px; }
td.date, th.date { font-weight: 600; color: var(--ink); white-space: nowrap; width: 1%; font-variant-numeric: tabular-nums; padding-right: 32px; }
.compare th[scope="col"] { width: 42%; font-family: var(--serif); font-size: 19px; font-weight: 600; letter-spacing: 0; text-transform: none; color: var(--ink); padding-block: 16px 14px; }
.compare th[scope="col"] span { font-family: var(--sans); }
.imaging td:nth-child(2) { width: 56%; }
.imaging th:nth-child(3), .imaging td:nth-child(3), .compare th:nth-child(3), .compare td:nth-child(3) { padding-left: 24px; border-left: 1px solid var(--rule); }
tr.flag > td { background: var(--flag); }
tr.flag > td:first-child { box-shadow: inset 3px 0 0 var(--flag-bar); padding-left: 16px; }

ul.ln { list-style: none; padding: 0; margin: 0; display: grid; gap: 6px; }
ul.ln li { position: relative; padding-left: 16px; }
ul.ln li::before { content: ""; position: absolute; left: 2px; top: .78em; width: 5px; height: 1px; background: var(--faint); }

.between { background: var(--wash); border-radius: 14px; padding: 22px 26px; display: grid; gap: 10px; font-size: 15.5px; }
.between h3 { font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.note { font-size: 14px; color: var(--muted); max-width: 70ch; }

/* Timeline: a rail with a dot per event, years set large */
#timeline .tw { border-top: 0; }
#timeline td, #timeline th { border-bottom: 0; }
#timeline td.date { text-align: right; color: var(--muted); font-weight: 500; width: 112px; padding: 9px 24px 9px 0; }
#timeline td:not(.date) { position: relative; padding: 9px 0 9px 26px; border-left: 1px solid var(--border); }
#timeline td:not(.date)::before { content: ""; position: absolute; left: -4px; top: 1.05em; width: 7px; height: 7px; border-radius: 50%; background: var(--page); border: 1.5px solid var(--muted); }
tr.yr th { font-family: var(--serif); font-size: 22px; font-weight: 600; color: var(--ink); padding: 26px 0 8px; width: auto; }
#timeline tr.yr:first-child th { padding-top: 4px; }

/* Questions */
ol.qs { list-style: none; padding: 0; counter-reset: q; display: grid; border-top: 1px solid var(--ink); }
ol.qs li { counter-increment: q; display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 8px; padding: 18px 0; border-bottom: 1px solid var(--rule); }
ol.qs li::before { content: counter(q); font-family: var(--serif); font-size: 22px; line-height: 1.2; font-weight: 600; color: var(--link); font-variant-numeric: tabular-nums; }

/* Records */
.recgrid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 36px; border-top: 1px solid var(--ink); padding-top: 20px; }
.recgrid h3 { font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
.recgrid ul { list-style: none; padding: 0; display: grid; }
.recgrid li { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--rule); font-size: 15px; line-height: 1.45; }
.recgrid li:last-child { border-bottom: 0; }
.recgrid li span { color: var(--muted); font-size: 13.5px; font-variant-numeric: tabular-nums; padding-top: 1px; }
.recgrid a { color: var(--ink); }
.recgrid a:hover { color: var(--link); }

footer { margin-top: 72px; padding-top: 22px; border-top: 1px solid var(--rule); font-size: 14px; color: var(--muted); }

@media (max-width: 960px) {
  .page { grid-template-columns: minmax(0, 1fr); gap: 0; }
  .toc { display: none; }
  main { max-width: 760px; margin: 0 auto; width: 100%; }
  .recgrid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .mnav { display: block; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: color-mix(in srgb, var(--page) 88%, transparent); -webkit-backdrop-filter: saturate(1.4) blur(12px); backdrop-filter: saturate(1.4) blur(12px); margin-inline: -24px; padding: 10px 24px; border-bottom: 1px solid var(--rule); }
  .mnav ul { list-style: none; margin: 0; padding: 0; display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
  .mnav ul::-webkit-scrollbar { display: none; }
  .mnav a { display: block; white-space: nowrap; font-size: 14px; font-weight: 500; color: var(--muted); padding: 6px 12px; border-radius: 999px; }
  .mnav a.on { background: var(--ink); color: var(--page); }
  section { scroll-margin-top: 64px; }
}
@media (max-width: 640px) {
  body { font-size: 16px; padding-block: 36px 64px; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); }
  .mnav { margin-inline: -20px; padding-inline: 20px; }
  h1 { font-size: 36px; }
  .dx { font-size: 18px; }
  h2 { font-size: 25px; }
  section { padding-top: 56px; gap: 18px; }
  .ptgrid { grid-template-columns: 112px minmax(0, 1fr); grid-auto-flow: row; grid-template-rows: none; column-gap: 12px; row-gap: 10px; }
  .ptgrid dt { padding-top: 3px; }
  .btn { flex: 1 1 100%; justify-content: center; }
  dl.facts { grid-template-columns: minmax(0, 1fr); }
  dl.facts dt { padding: 16px 0 4px; border-bottom: 0; }
  dl.facts dd { padding: 0 0 16px; }
  dl.facts dt small { display: inline; margin-left: 8px; }
  table.stack thead { display: none; }
  table.stack, table.stack tbody, table.stack tr, table.stack td, table.stack th { display: block; width: auto !important; }
  table.stack tr { padding: 14px 0; border-bottom: 1px solid var(--rule); }
  table.stack tbody tr:last-child { border-bottom: 0; }
  table.stack td, table.stack th { border: 0 !important; padding: 2px 0 !important; background: none !important; box-shadow: none !important; }
  table.stack td[data-k]::before { content: attr(data-k); display: block; color: var(--muted); font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; margin: 10px 0 4px; }
  table.stack tbody th { font-size: 15px; color: var(--ink); font-weight: 600; }
  table.stack tr.flag { background: var(--flag); box-shadow: inset 3px 0 0 var(--flag-bar); padding-inline: 14px; border-radius: 2px; }
  table:not(.stack) th, table:not(.stack) td { padding: 14px 16px 14px 0; }
  table:not(.stack) tbody th { padding-right: 16px; }
  #timeline table.stack tr { display: grid; grid-template-columns: 76px minmax(0, 1fr); padding: 0; border: 0; }
  #timeline table.stack tr.yr { display: block; }
  #timeline td.date { text-align: left; font-size: 14px; padding: 9px 12px 9px 0 !important; white-space: normal; }
  #timeline td:not(.date) { border-left: 1px solid var(--border) !important; padding: 9px 0 9px 18px !important; }
  #timeline tr.yr th { padding: 22px 0 6px !important; }
  .recgrid { grid-template-columns: minmax(0, 1fr); gap: 28px; }
  ol.qs li { grid-template-columns: 34px minmax(0, 1fr); }
}
@media print {
  body { background: #fff; color: #000; padding: 0; font-size: 10.5pt; }
  .page { display: block; max-width: none; }
  .toc, .mnav, .actions { display: none !important; }
  main { max-width: none; }
  section { padding-top: 28px; }
  h2 { break-after: avoid; }
  tr, li, dl.facts dd, .between { break-inside: avoid; }
  a { color: inherit; }
}
</style>
<style>
[hidden] { display: none !important; }
.gate { min-height: 70vh; display: grid; place-items: center; }
.gate form { width: 100%; max-width: 360px; display: grid; gap: 14px; }
.gate h1 { font-size: 32px; }
.gate p { color: var(--muted); font-size: 15px; }
.gate label { font-size: 14px; font-weight: 600; color: var(--ink); }
.gate input { font: inherit; font-size: 17px; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--border); background: var(--bg); color: var(--ink); width: 100%; }
.gate input:focus { outline: 2px solid var(--link); outline-offset: 1px; border-color: var(--link); }
.gate button { font: inherit; font-weight: 600; font-size: 16px; padding: 12px; border-radius: 999px; border: 0; background: var(--ink); color: var(--page); cursor: pointer; }
.gate button:disabled { opacity: .6; cursor: default; }
.gate .err { color: #c0392b; font-size: 14px; min-height: 1.4em; }
</style>

</head>

  <form id="unlock" autocomplete="off">

    <h1>Protected case brief</h1>
    <p>Enter the password you were given.</p>
    <label for="pw">Password</label>
    <input id="pw" name="pw" type="password" autocapitalize="none" autocorrect="off" spellcheck="false" required autofocus>
    <button id="go" type="submit">View</button>
    <div class="err" id="err" role="alert"></div>
  </form>
</div>
<div id="app" hidden></div>

  var ids = Array.from(new Set(links.map(function (a) { return a.getAttribute('href').slice(1); })));
  var secs = ids.map(function (id) { return document.getElementById(id); }).filter(Boolean);
  function update() {
    var y = window.scrollY + 120, cur = secs[0] && secs[0].id;
    secs.forEach(function (s) { if (s.offsetTop <= y) cur = s.id; });
    if (window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - 4) cur = secs[secs.length - 1].id;
